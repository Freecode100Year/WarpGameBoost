name: debug
on:
  push:
    branches: [feat/v6only]
jobs:
  debug:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ['-v6only=true', '-v6only=false']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
          go build -o WarpGameBoost.exe .
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          '' | Set-Content empty.txt
          $p = Start-Process .\WarpGameBoost.exe -ArgumentList '-count','80','${{ matrix.mode }}','-selftest' -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -PassThru
          foreach ($i in 1..60) { Start-Sleep 1; if ((Get-Content out.txt -Raw -ErrorAction SilentlyContinue) -match '入口 \S+ 没有回应|握手|DEBUG') {} ; if (Get-NetRoute -DestinationPrefix 8000::/1 -ErrorAction SilentlyContinue) { break } }
          Start-Sleep 4
          "--- ping6"; ping -6 -n 2 2606:4700:4700::1111
          "--- curl -6 -v"; curl.exe -6 -v -s -m 8 https://www.cloudflare.com/cdn-cgi/trace 2>&1 | Select-Object -Last 15
          "--- curl http v6 literal"; curl.exe -v -s -m 8 "http://[2606:4700:4700::1111]/cdn-cgi/trace" 2>&1 | Select-Object -Last 15
          "--- curl -4"; curl.exe -4 -s -m 8 https://www.cloudflare.com/cdn-cgi/trace 2>&1 | Select-String 'ip=|warp='
          $p.WaitForExit(60000) | Out-Null
          Get-Content out.txt -Encoding utf8
