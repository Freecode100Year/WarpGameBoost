name: debug
on:
  push:
    branches: [debug]
jobs:
  d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt; Copy-Item wt\wintun\bin\amd64\wintun.dll .
          go build -o w.exe .
          foreach ($i in 1..5) {
            "===== run $i"
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\WarpGameBoost" -ErrorAction SilentlyContinue
            .\w.exe -selftest -v -count 200 2>&1 | Select-String -NotMatch 'Receiving keepalive|Sending keepalive' | Select-Object -First 80
            "exit=$LASTEXITCODE"
          }
