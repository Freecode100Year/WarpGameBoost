name: debug
on:
  push:
    branches: [feat/v6only]
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
          go build -o WarpGameBoost.exe .
      - shell: pwsh
        run: |
          Get-DnsClientServerAddress -AddressFamily IPv4 | Format-Table -AutoSize
          Find-NetRoute -RemoteIPAddress 168.63.129.16 | Select-Object -Last 1 | Format-List DestinationPrefix,InterfaceAlias,NextHop
          '' | Set-Content empty.txt
          $p = Start-Process .\WarpGameBoost.exe -ArgumentList '-count','80','-v' -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -PassThru
          Start-Sleep 50
          Get-Content out.txt -Encoding utf8 | Where-Object { $_ -notmatch '^wg: ' } | Select-Object -First 40
          Find-NetRoute -RemoteIPAddress 168.63.129.16 | Select-Object -Last 1 | Format-List DestinationPrefix,InterfaceAlias
          Get-NetIPAddress -InterfaceAlias WarpGameBoost | Format-Table IPAddress,PrefixOrigin -AutoSize
          Clear-DnsClientCache
          "--- A";    Resolve-DnsName www.cloudflare.com -Type A -ErrorAction Continue | Format-Table -AutoSize
          "--- AAAA"; Resolve-DnsName www.cloudflare.com -Type AAAA -ErrorAction Continue | Format-Table -AutoSize
          "--- curl -6"; curl.exe -6 -s -m 10 https://www.cloudflare.com/cdn-cgi/trace
          "--- curl v6 literal"; curl.exe -s -m 10 "https://[2606:4700:4700::1111]/cdn-cgi/trace"
          "--- iwr"; try { (Invoke-WebRequest https://www.cloudflare.com/cdn-cgi/trace -UseBasicParsing -TimeoutSec 10).Content } catch { $_.Exception.Message }
          Stop-Process -Id $p.Id -Force
