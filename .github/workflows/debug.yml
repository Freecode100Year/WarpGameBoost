name: debug
on:
  push:
    branches: [feat/v6only]
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
          go build -o WarpGameBoost.exe .
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          '' | Set-Content empty.txt
          $p = Start-Process .\WarpGameBoost.exe -ArgumentList '-count','80','-v' -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -PassThru
          foreach ($i in 1..90) { Start-Sleep 1; if ((Get-Content out.txt -Raw -Encoding utf8 -ErrorAction SilentlyContinue) -match '加速已开启|验证失败|连接失败') { break } }
          "ready after $i s"
          function T($name, $sb) { $sw = [Diagnostics.Stopwatch]::StartNew(); $r = & $sb 2>&1 | Out-String; "--- $name ($([int]$sw.ElapsedMilliseconds) ms): $($r.Trim() -replace '\s+',' ')" }
          T 'resolve' { (Resolve-DnsName www.cloudflare.com | Select-Object -ExpandProperty IPAddress) -join ' ' }
          T 'getaddrinfo' { [Net.Dns]::GetHostAddresses('www.cloudflare.com') -join ' ' }
          T 'curl auto -v' { curl.exe -v -s -m 10 -o NUL https://www.cloudflare.com/cdn-cgi/trace 2>&1 | Select-String 'IPv|Trying|connect|Failed|schannel' }
          T 'prefix policy' { netsh interface ipv6 show prefixpolicies | Out-String }
          T 'ipv6 addrs' { Get-NetIPAddress -AddressFamily IPv6 | ForEach-Object { "$($_.InterfaceAlias)=$($_.IPAddress)/$($_.PrefixOrigin)" } }
          T 'v6 routes' { Get-NetRoute -AddressFamily IPv6 | Where-Object DestinationPrefix -in '::/0','::/1','8000::/1' | ForEach-Object { "$($_.InterfaceAlias) $($_.DestinationPrefix) $($_.RouteMetric)" } }
          Stop-Process -Id $p.Id -Force
          Get-Content out.txt -Encoding utf8 | Where-Object { $_ -notmatch 'DEBUG: ' } | Select-Object -Last 25
