name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch Wintun 0.14.1 (signed by WireGuard LLC)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $h = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($h -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') { throw "wintun hash $h" }
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
      - run: go vet ./...
      - run: go test ./...
      - name: Version
        shell: pwsh
        run: |
          # Tag builds are the tag (v0.3.0 -> 0.3.0); other builds are the last
          # tag plus commits since, e.g. 0.3.0-2-gabc1234.
          $desc = (git describe --tags --always) -replace '^v', ''
          $num = if ($desc -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.0.0' }
          "VERSION=$desc" >> $env:GITHUB_ENV
          "VERSION_NUM=$num" >> $env:GITHUB_ENV
          "version $desc (file version $num)"
      - name: Windows version resource (file properties) and UAC manifest
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres simply --arch amd64 --manifest cli --admin --product-name WarpGameBoost `
            --file-description "WarpGameBoost - Cloudflare WARP game acceleration" `
            --product-version $env:VERSION_NUM --file-version $env:VERSION_NUM `
            --original-filename WarpGameBoost.exe --copyright "MIT License, Freecode100Year"
      - run: go build -trimpath -ldflags "-s -w -buildid= -X main.version=${{ env.VERSION }}" -o WarpGameBoost.exe .
      - name: Version is embedded
        shell: pwsh
        run: |
          $out = .\WarpGameBoost.exe -version
          $out
          if ($out -ne "WarpGameBoost $env:VERSION") { throw "version flag says $out" }
          $fv = (Get-Item .\WarpGameBoost.exe).VersionInfo
          "file version $($fv.FileVersion), product $($fv.ProductName) $($fv.ProductVersion)"
          if (-not $fv.FileVersion.StartsWith($env:VERSION_NUM)) { throw "file version $($fv.FileVersion)" }
      - name: Self-test -v6only with system DNS (the runner has no IPv6, so IPv4 entries)
        shell: pwsh
        run: |
          .\WarpGameBoost.exe -selftest -v6only -dns system -diag=false -count 80
          if ($LASTEXITCODE -ne 0) { throw "selftest -v6only failed" }
          Start-Sleep 2
          if (Get-NetAdapter -Name WarpGameBoost -ErrorAction SilentlyContinue) { throw "adapter left behind" }
      - name: Self-test with defaults (diagnosis, both exits, malware-blocking DNS)
        shell: pwsh
        run: |
          .\WarpGameBoost.exe -selftest -count 80
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
      - name: Whole-system with defaults, and a killed process leaves no adapter
        shell: pwsh
        run: |
          '' | Set-Content empty.txt
          $p = Start-Process .\WarpGameBoost.exe -ArgumentList '-diag=false','-count','80' -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -PassThru
          function Fail($m) { Get-Content out.txt -Encoding utf8; Stop-Process -Id $p.Id -Force; throw $m }
          foreach ($i in 1..40) { Start-Sleep 2; if ((Get-Content out.txt -Raw -Encoding utf8 -ErrorAction SilentlyContinue) -match '加速已开启|失败') { break } }
          Get-Content out.txt -Encoding utf8
          $t4 = curl.exe -4 -s -m 10 https://www.cloudflare.com/cdn-cgi/trace
          $t6 = curl.exe -6 -s -m 10 https://www.cloudflare.com/cdn-cgi/trace
          "IPv4 exit: $($t4 | Select-String 'ip=|warp=')"
          "IPv6 exit: $($t6 | Select-String 'ip=|warp=')"
          if (-not ($t4 -match 'warp=on')) { Fail "IPv4 exit is not WARP" }
          if (-not ($t6 -match 'warp=on')) { Fail "IPv6 exit is not WARP" }
          # fec0:0:0:ffff::1-3 are the placeholders Windows shows on IPv6
          # interfaces without DNS servers.
          $dns = (Get-DnsClientServerAddress -InterfaceAlias WarpGameBoost).ServerAddresses | Where-Object { $_ -notlike 'fec0:0:0:ffff::*' }
          "adapter DNS servers: [$($dns -join ', ')]"
          if (($dns -join ',') -ne '1.1.1.2,1.0.0.2,2606:4700:4700::1112,2606:4700:4700::1002') { Fail "unexpected adapter DNS: $dns" }
          # The system resolver (no -Server) must be the malware-blocking one:
          # Cloudflare's test name resolves to 0.0.0.0 there and normally elsewhere.
          Clear-DnsClientCache
          $blocked = (Resolve-DnsName malware.testcategory.com -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress -join ','
          $normal = (Resolve-DnsName www.blizzard.com -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress -join ','
          "malware.testcategory.com -> $blocked; www.blizzard.com -> $normal"
          if ($blocked -ne '0.0.0.0') { Fail "malware name not blocked" }
          if (-not $normal) { Fail "name resolution broken" }
          $addrs = [Net.Dns]::GetHostAddresses('www.cloudflare.com') -join ' '
          "getaddrinfo: $addrs"
          if ($addrs -notmatch ':') { Fail "Windows does not hand out IPv6 addresses" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          if (Get-NetAdapter -Name WarpGameBoost -ErrorAction SilentlyContinue) { throw "adapter left behind after kill" }
          Clear-DnsClientCache
          $after = (Resolve-DnsName malware.testcategory.com -Type A -ErrorAction SilentlyContinue | Where-Object Type -eq 'A').IPAddress -join ','
          "after exit: malware.testcategory.com -> $after"
          if ($after -eq '0.0.0.0') { throw "DNS not restored" }
          $t = (Invoke-WebRequest https://www.cloudflare.com/cdn-cgi/trace -UseBasicParsing -TimeoutSec 10).Content
          if ($t -notmatch 'warp=off') { throw "network not restored: $t" }
          "network restored: warp=off"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item WarpGameBoost.exe dist\
          Push-Location dist; (Get-FileHash WarpGameBoost.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  WarpGameBoost.exe" }) | Set-Content SHA256SUMS.txt; Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: WarpGameBoost
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/WarpGameBoost.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/WarpGameBoost.exe dist/SHA256SUMS.txt --title $env:GITHUB_REF_NAME --notes-file RELEASE_NOTES.md
