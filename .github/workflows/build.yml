name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch Wintun 0.14.1 (signed by WireGuard LLC)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $h = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($h -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') { throw "wintun hash $h" }
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
      - run: go vet ./...
      - run: go test ./...
      - name: Version
        shell: pwsh
        run: |
          # Tag builds are the tag (v0.3.0 -> 0.3.0); other builds are the last
          # tag plus commits since, e.g. 0.3.0-2-gabc1234.
          $desc = (git describe --tags --always) -replace '^v', ''
          $num = if ($desc -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.0.0' }
          "VERSION=$desc" >> $env:GITHUB_ENV
          "VERSION_NUM=$num" >> $env:GITHUB_ENV
          "version $desc (file version $num)"
      - name: Windows version resource (file properties) and UAC manifest
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres simply --arch amd64 --manifest cli --admin --product-name WarpGameBoost `
            --file-description "WarpGameBoost - Cloudflare WARP game acceleration" `
            --product-version $env:VERSION_NUM --file-version $env:VERSION_NUM `
            --original-filename WarpGameBoost.exe --copyright "MIT License, Freecode100Year"
      - run: go build -trimpath -ldflags "-s -w -buildid= -X main.version=${{ env.VERSION }}" -o WarpGameBoost.exe .
      - name: Version is embedded
        shell: pwsh
        run: |
          $out = .\WarpGameBoost.exe -version
          $out
          if ($out -ne "WarpGameBoost $env:VERSION") { throw "version flag says $out" }
          $fv = (Get-Item .\WarpGameBoost.exe).VersionInfo
          "file version $($fv.FileVersion), product $($fv.ProductName) $($fv.ProductVersion)"
          if (-not $fv.FileVersion.StartsWith($env:VERSION_NUM)) { throw "file version $($fv.FileVersion)" }
      - name: Self-test with IPv4 exit (the runner has no IPv6, so IPv4 entries are allowed)
        shell: pwsh
        run: |
          .\WarpGameBoost.exe -selftest -ipv4 -v6only=false -count 80
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          Start-Sleep 2
          if (Get-NetAdapter -Name WarpGameBoost -ErrorAction SilentlyContinue) { throw "adapter left behind" }
      - name: Self-test with defaults (IPv6-only exit; no IPv6 here, so IPv4 entries)
        shell: pwsh
        run: |
          .\WarpGameBoost.exe -selftest -count 80
          if ($LASTEXITCODE -ne 0) { throw "selftest without IPv6 failed" }
      - name: Whole-system traffic leaves over IPv6 only, and a killed process leaves no adapter
        shell: pwsh
        run: |
          '' | Set-Content empty.txt
          $p = Start-Process .\WarpGameBoost.exe -ArgumentList '-ipv4','-count','80' -RedirectStandardInput empty.txt -RedirectStandardOutput out.txt -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 3
            $t = try { (Invoke-WebRequest https://www.cloudflare.com/cdn-cgi/trace -UseBasicParsing -TimeoutSec 5).Content } catch { '' }
            if ($t -match 'warp=on') { $ok = $true; break }
          }
          "trace ip: $(($t -split "`n" | Where-Object { $_ -like 'ip=*' }))"
          if ($t -notmatch 'ip=[0-9a-f]*:') { Stop-Process -Id $p.Id -Force; throw "exit is not IPv6" }
          $c = New-Object Net.Sockets.TcpClient
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $v4 = try { $c.ConnectAsync('1.1.1.1', 443).Wait(8000) -and $c.Connected } catch { $false }
          $c.Dispose()
          "IPv4 1.1.1.1:443 reachable: $v4 (answered in $($sw.ElapsedMilliseconds) ms)"
          if ($v4) { Stop-Process -Id $p.Id -Force; throw "IPv4 not blocked" }
          if ($sw.ElapsedMilliseconds -gt 6000) { Stop-Process -Id $p.Id -Force; throw "IPv4 is dropped, not refused" }
          $addrs = [Net.Dns]::GetHostAddresses('www.cloudflare.com') -join ' '
          "getaddrinfo: $addrs"
          if ($addrs -notmatch ':') { Stop-Process -Id $p.Id -Force; throw "Windows does not hand out IPv6 addresses" }
          Get-Content out.txt -Encoding utf8
          Get-NetRoute -DestinationPrefix 0.0.0.0/1, 128.0.0.0/1 -ErrorAction SilentlyContinue | Format-Table -AutoSize
          # With -v6only the adapter carries Cloudflare's IPv6 resolver and
          # nothing else (fec0:0:0:ffff::1-3 are Windows' placeholders).
          $dns = (Get-DnsClientServerAddress -InterfaceAlias WarpGameBoost -ErrorAction SilentlyContinue).ServerAddresses | Where-Object { $_ -notlike 'fec0:0:0:ffff::*' }
          "adapter DNS servers: [$($dns -join ', ')]"
          if (($dns -join ',') -ne '2606:4700:4700::1111,2606:4700:4700::1001') { Stop-Process -Id $p.Id -Force; throw "unexpected adapter DNS: $dns" }
          Clear-DnsClientCache
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $resolved = Resolve-DnsName www.blizzard.com -ErrorAction SilentlyContinue | Select-Object -First 1
          "system DNS still resolves: $($resolved.Name) in $($sw.ElapsedMilliseconds) ms"
          if (-not $resolved) { Stop-Process -Id $p.Id -Force; throw "name resolution broken" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          if (-not $ok) { throw "system traffic did not go through WARP" }
          if (Get-NetAdapter -Name WarpGameBoost -ErrorAction SilentlyContinue) { throw "adapter left behind after kill" }
          $t = (Invoke-WebRequest https://www.cloudflare.com/cdn-cgi/trace -UseBasicParsing -TimeoutSec 10).Content
          if ($t -notmatch 'warp=off') { throw "network not restored: $t" }
          "network restored: warp=off"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item WarpGameBoost.exe dist\
          Push-Location dist; (Get-FileHash WarpGameBoost.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  WarpGameBoost.exe" }) | Set-Content SHA256SUMS.txt; Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: WarpGameBoost
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/WarpGameBoost.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/WarpGameBoost.exe dist/SHA256SUMS.txt --title $env:GITHUB_REF_NAME --notes-file RELEASE_NOTES.md
